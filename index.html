<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>نظام الحضور الذكي</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --primary:#004e92; --dark:#2c3e50; --green:#27ae60;
    --red:#e74c3c; --amber:#f39c12; --line:#e3e6ea;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'Segoe UI',Tahoma,sans-serif;background:#eef1f5;color:#233;
    min-height:100vh;padding:14px;display:flex;justify-content:center;
  }
  .app{width:100%;max-width:520px}
  .card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;
        box-shadow:0 2px 10px rgba(0,0,0,.06)}
  h1{font-size:19px;color:var(--primary);margin-bottom:4px}
  .sub{font-size:13px;color:#7a8590}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px;color:var(--dark)}
  input{width:100%;padding:13px;border:2px solid var(--line);border-radius:10px;
        font-size:16px;font-family:inherit;outline:none;background:#fff}
  input:focus{border-color:var(--primary)}
  .btn{width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;
       font-weight:700;color:#fff;cursor:pointer;font-family:inherit;margin-top:12px}
  .btn:disabled{opacity:.45}
  .btn-p{background:var(--primary)} .btn-g{background:var(--green)}
  .btn-r{background:var(--red)}
  .btn-ghost{background:#fff;color:var(--dark);border:2px solid var(--line)}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .top{display:flex;justify-content:space-between;align-items:center;
       background:#fff;border-radius:14px;padding:12px 16px;margin-bottom:14px;
       box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .who{font-size:14px;font-weight:700;color:var(--dark)}
  .link{background:none;border:none;color:var(--red);font-size:13px;
        cursor:pointer;font-family:inherit;font-weight:600}

  /* الصندوق ليه أبعاد ثابتة من البداية — المكتبة محتاجة تقيسه قبل ما تشتغل */
  #readerWrap{display:none;margin-top:12px}
  #readerWrap.on{display:block}
  #reader{width:100%;min-height:260px;border-radius:12px;overflow:hidden;background:#000}
  #reader video{width:100%!important;display:block;border-radius:12px}
  #reader img[alt="Info icon"]{display:none}

  .result{border-radius:12px;padding:16px;margin-top:12px;text-align:center;
          font-size:16px;font-weight:700;line-height:1.6;display:none;white-space:pre-line}
  .ok{background:#e8f8ee;color:#1b6b3f;border:2px solid var(--green)}
  .bad{background:#fdecea;color:#96271c;border:2px solid var(--red)}
  .wait{background:#fff8e6;color:#8a5a06;border:2px solid var(--amber)}
  .ev{border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
  .ev.live{border-color:var(--green);background:#f4fdf7}
  .ev-n{font-weight:700;font-size:15px;color:var(--dark)}
  .ev-m{font-size:12px;color:#7a8590;margin-top:4px}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;
        font-weight:700;color:#fff;background:var(--green)}
  .bar{background:#fff8e6;border:1px solid #f5d98b;color:#8a5a06;border-radius:10px;
       padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:12px;
       display:none;align-items:center;justify-content:space-between;gap:10px}
  .bar button{background:var(--amber);color:#fff;border:none;border-radius:8px;
              padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .hint{font-size:12px;color:#8b95a1;margin-top:8px;line-height:1.6}
  .hide{display:none!important}
  .list{max-height:260px;overflow-y:auto;margin-top:10px;
        border:1px solid var(--line);border-radius:10px}
  .list:empty{display:none}
  .item{padding:13px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
  .item:last-child{border-bottom:none}
  .item:active{background:#e8f0fb}
  .item small{color:#7a8590;font-size:12px}
  .confirm{border:2px solid var(--primary);background:#f2f7fd;border-radius:12px;
           padding:14px;margin-top:12px;display:none}
  .confirm b{display:block;font-size:16px;color:var(--dark);margin-bottom:2px}

  #toasts{position:fixed;top:12px;left:50%;transform:translateX(-50%);
          width:calc(100% - 28px);max-width:460px;z-index:9000;
          display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{background:#fff;border-radius:12px;padding:13px 16px;font-size:14px;
         font-weight:600;line-height:1.5;box-shadow:0 6px 22px rgba(0,0,0,.16);
         border-right:6px solid var(--primary);animation:drop .22s ease-out;white-space:pre-line}
  .toast.t-ok{border-right-color:var(--green);color:#1b6b3f;background:#f2fcf6}
  .toast.t-bad{border-right-color:var(--red);color:#96271c;background:#fef5f4}
  .toast.t-warn{border-right-color:var(--amber);color:#8a5a06;background:#fffaf0}
  @keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

  #modal{position:fixed;inset:0;background:rgba(20,28,38,.55);z-index:9500;
         display:none;align-items:center;justify-content:center;padding:20px}
  #modal.on{display:flex}
  .mbox{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:380px;
        text-align:center;animation:drop .2s ease-out}
  .mbox h2{font-size:18px;color:var(--dark);margin-bottom:8px}
  .mbox p{font-size:14px;color:#6b7683;line-height:1.7;margin-bottom:6px}
</style>
</head>
<body>

<div id="toasts"></div>

<div id="modal"><div class="mbox">
  <h2 id="mTitle"></h2><p id="mText"></p>
  <div class="row">
    <button class="btn btn-r" id="mYes">تأكيد</button>
    <button class="btn btn-ghost" id="mNo">إلغاء</button>
  </div>
</div></div>

<div class="app">
    <div id="brandBar" style="display:none;text-align:center;margin-bottom:14px">
    <img id="logoL" style="height:46px;margin:0 8px;vertical-align:middle">
    <img id="logoR" style="height:46px;margin:0 8px;vertical-align:middle">
    <div id="orgT" style="font-weight:800;color:#2c3e50;margin-top:6px;font-size:14px"></div>
  </div>

  <div id="loginView" class="card">
    <h1>نظام الحضور الذكي</h1>
    <p class="sub">سجّل دخولك عشان تبدأ</p>
    <label>اسم الإداري</label>
    <input id="inName" autocomplete="off" placeholder="اكتب اسمك زي ما هو في النظام">
    <label>الكود السري (٤ أرقام)</label>
    <input id="inPin" type="tel" inputmode="numeric" maxlength="4" placeholder="••••">
    <button class="btn btn-p" id="btnLogin">دخول</button>
    <div id="loginMsg" class="result bad"></div>
  </div>

  <div id="mainView" class="hide">
    <div class="top">
      <div><div class="who" id="whoName"></div><div class="sub" id="whoRole"></div></div>
            <div>
        <button class="link" style="color:var(--primary)"
                onclick="location.href='admin.html'">لوحة الإدارة</button>
        <button class="link" id="btnOut">خروج</button>
      </div>
    </div>

    <div class="bar" id="qBar">
      <span id="qTxt"></span>
      <button id="btnSync">ارفعها دلوقتي</button>
    </div>

    <div class="card">
      <h1>الفعالية</h1>
      <div id="evBox"><p class="sub">جاري التحميل...</p></div>
    </div>

    <div class="card">
      <button class="btn btn-g" id="btnCam">تشغيل الكاميرا</button>
      <div id="readerWrap"><div id="reader"></div></div>
      <div id="scanRes" class="result"></div>
      <button class="btn btn-ghost hide" id="btnSwap">تبديل الكاميرا</button>
      <button class="btn btn-ghost hide" id="btnStop">إيقاف الكاميرا</button>
      <p class="hint" id="camHint"></p>
    </div>

    <div class="card">
      <h1>تسجيل يدوي</h1>
      <p class="sub">لو الكود مش راضي يتقري</p>
      <label>ابحث بالاسم أو الكود أو الموبايل</label>
      <input id="inSearch" autocomplete="off" placeholder="اكتب حرف أو رقم...">
      <div class="list" id="searchList"></div>

      <div class="confirm" id="manConfirm">
        <b id="manName"></b>
        <span class="sub" id="manMeta"></span>
        <div class="row">
          <button class="btn btn-p" id="btnManOk">تسجيل الحضور</button>
          <button class="btn btn-ghost" id="btnManNo">إلغاء</button>
        </div>
      </div>

      <div id="manRes" class="result"></div>
    </div>
  </div>

</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxew0UDHiXeetZMJyhd6t7jiX3igZ6fviqqlLJUQjVPqBuJ7aPbLIjuzKZs7ZdDsPuf/exec';
const K = { tok:'v4_token', name:'v4_name', perms:'v4_perms', queue:'v4_queue', cam:'v4_cam' };
const $ = id => document.getElementById(id);

let state = { token:null, me:null, events:[], vols:[], settings:null, drift:0,
              activeEvent:null, qr:null, busy:false, picked:null,
              cams:[], camIdx:0, starting:false };

/* ================= تنبيهات ويب ================= */
function toast(kind, msg, ms){
  const el = document.createElement('div');
  el.className = 'toast t-' + kind;
  el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .3s'; el.style.opacity = '0';
    setTimeout(() => el.remove(), 320);
  }, ms || (kind === 'bad' ? 5500 : 3400));
}

let modalYes = null;
function ask(title, text, onYes){
  $('mTitle').textContent = title; $('mText').textContent = text;
  modalYes = onYes; $('modal').classList.add('on');
}
$('mNo').onclick = () => { $('modal').classList.remove('on'); modalYes = null; };
$('mYes').onclick = () => {
  $('modal').classList.remove('on');
  const f = modalYes; modalYes = null; if(f) f();
};

/* ================= الاتصال ================= */
async function call(payload){
  const res = await fetch(API, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  return res.json();
}
const now = () => Date.now() + state.drift;

const AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';
function norm(s){
  let out = '';
  for(const ch of String(s == null ? '' : s)){
    let i = AR.indexOf(ch); if(i < 0) i = FA.indexOf(ch);
    out += (i >= 0) ? String(i) : ch;
  }
  return out.toLowerCase().replace(/[\s\-_.]/g, '');
}

/* ================= الدخول ================= */
$('btnLogin').onclick = async () => {
  const name = $('inName').value.trim(), pin = norm($('inPin').value);
  if(!name || !/^\d{4}$/.test(pin)) return loginErr('اكتب اسمك وكود من ٤ أرقام');

  $('btnLogin').disabled = true; $('btnLogin').textContent = 'جاري الدخول...';
  try{
    const r = await call({action:'login', name, pin});
    if(!r.ok) return loginErr(r.error);
    localStorage.setItem(K.tok, r.data.token);
    localStorage.setItem(K.name, r.data.name);
    localStorage.setItem(K.perms, JSON.stringify(r.data.perms));
    state.token = r.data.token;
    await boot();
    toast('ok', 'أهلاً ' + r.data.name);
  }catch(e){ loginErr('مفيش اتصال بالنت'); }
  finally{ $('btnLogin').disabled = false; $('btnLogin').textContent = 'دخول'; }
};
$('inPin').addEventListener('keydown', e => { if(e.key === 'Enter') $('btnLogin').click(); });

function loginErr(m){
  $('loginMsg').textContent = m; $('loginMsg').style.display = 'block';
  toast('bad', m);
}

$('btnOut').onclick = () => ask('تسجيل خروج', 'هتحتاج تدخل الكود السري تاني.', async () => {
  await stopCam();
  [K.tok, K.name, K.perms].forEach(k => localStorage.removeItem(k));
  location.reload();
});

/* ================= التحميل ================= */
async function boot(){
  const r = await call({action:'bootstrap', token: state.token});
  if(!r.ok){
    localStorage.removeItem(K.tok);
    $('loginView').classList.remove('hide'); $('mainView').classList.add('hide');
    return loginErr(r.error);
  }
  state.me = r.data.me;
  state.events = r.data.events;
  state.vols = r.data.volunteers;
  state.settings = r.data.settings;
  state.drift = r.data.serverTime - Date.now();

  state.vols.forEach(v => { v._n = norm(v.name); v._c = norm(v.code); v._p = norm(v.phone); });

  $('loginView').classList.add('hide'); $('mainView').classList.remove('hide');
  $('whoName').textContent = state.me.name;
  $('whoRole').textContent = state.me.perms.admins ? 'أدمن كامل' : 'إداري';

  renderEvents(); renderQueue();
}

/* ================= الفعاليات ================= */
function renderEvents(){
  const t = now();
  const live = state.events.filter(e => t >= e.opensAt && t <= e.endsAt);
  const box = $('evBox');

  if(live.length === 0){
    const next = state.events.filter(e => e.opensAt > t)
                             .sort((a,b) => a.opensAt - b.opensAt)[0];
    box.innerHTML = next
      ? `<div class="ev"><div class="ev-n">${esc(next.name)}</div>
         <div class="ev-m">${next.dateStr} — الكاميرا هتفتح قبلها بـ ${state.settings.cameraBefore} دقيقة</div></div>`
      : `<p class="sub">مفيش أي فعالية قادمة. ضيف فعالية في شيت Events_Settings.</p>`;
    state.activeEvent = null;
    $('camHint').textContent = 'الكاميرا بتفتح بس وقت الفعالية';
    return;
  }

  box.innerHTML = live.map((e,i) => {
    const mins = Math.round((t - e.startsAt) / 60000);
    const note = mins >= 0 ? `بدأت من ${mins} دقيقة` : `تبدأ بعد ${-mins} دقيقة`;
    return `<div class="ev live" data-i="${i}">
      <div class="ev-n">${esc(e.name)} <span class="pill">مفتوحة</span></div>
      <div class="ev-m">${esc(e.type)} · ${e.dateStr} · اليوم ${e.day} · ${note}</div></div>`;
  }).join('');

  if(!state.activeEvent || !live.some(e => e.id === state.activeEvent.id))
    state.activeEvent = live[0];

  if(live.length > 1){
    box.querySelectorAll('.ev').forEach(el => {
      el.onclick = () => {
        state.activeEvent = live[+el.dataset.i];
        box.querySelectorAll('.ev').forEach(x => x.style.borderColor = 'var(--line)');
        el.style.borderColor = 'var(--green)';
        toast('ok', 'الفعالية المختارة: ' + state.activeEvent.name);
      };
    });
    $('camHint').textContent = 'فيه أكتر من فعالية — اضغط على اللي عايزها';
  } else $('camHint').textContent = '';
}
setInterval(() => { if(state.me && !state.qr) renderEvents(); }, 60000);

/* ================= الكاميرا ================= */
$('btnCam').onclick = () => startCam();
$('btnStop').onclick = () => stopCam(true);
$('btnSwap').onclick = swapCam;

const raf = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

/** بيجيب قايمة الكاميرات الحقيقية ويرتبها: الخلفية الأول */
async function loadCams(){
  if(state.cams.length) return state.cams;
  const list = await Html5Qrcode.getCameras();
  if(!list || !list.length) throw new Error('NotFoundError');

  const isBack = c => /back|rear|environment|خلف/i.test(c.label || '');
  const back = list.filter(isBack), rest = list.filter(c => !isBack(c));
  state.cams = back.concat(rest);

  const saved = localStorage.getItem(K.cam);
  const i = state.cams.findIndex(c => c.id === saved);
  state.camIdx = i >= 0 ? i : 0;
  return state.cams;
}

async function startCam(){
  if(state.starting || state.qr) return;

  if(!state.activeEvent){
    const next = state.events.filter(e => e.opensAt > now())
                             .sort((a,b) => a.opensAt - b.opensAt)[0];
    return toast('warn', next
      ? 'مفيش فعالية مفتوحة دلوقتي.\nالجاية: ' + next.name + ' يوم ' + next.dateStr
      : 'مفيش فعالية مفتوحة دلوقتي.\nضيف فعالية في شيت Events_Settings.');
  }
  if(typeof Html5Qrcode === 'undefined')
    return toast('bad', 'مكتبة الكاميرا مش اتحمّلت. اعمل Refresh للصفحة.');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return toast('bad', 'المتصفح ده مش بيدعم الكاميرا.\nلازم الصفحة تكون على https.');

  state.starting = true;
  $('btnCam').disabled = true;
  $('btnCam').textContent = 'جاري التشغيل...';

  // مهم جداً: نظهر الصندوق ونستنى الرسم قبل ما المكتبة تقيس عرضه
  $('readerWrap').classList.add('on');
  await raf();

  try{
    await loadCams();

    const w = $('reader').clientWidth || 300;
    if(w < 50) throw new Error('صندوق الكاميرا معندوش عرض');
    const side = Math.max(180, Math.min(320, Math.floor(w * 0.72)));

    const cfg = {
      fps: 10,
      qrbox: { width: side, height: side },
      aspectRatio: 1.0,
      disableFlip: false,
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    state.qr = new Html5Qrcode('reader', { verbose: false });
    await state.qr.start(state.cams[state.camIdx].id, cfg, onScan, () => {});
    localStorage.setItem(K.cam, state.cams[state.camIdx].id);

    $('btnCam').classList.add('hide');
    $('btnStop').classList.remove('hide');
    if(state.cams.length > 1) $('btnSwap').classList.remove('hide');
    say('scanRes', 'wait', 'وجّه الكاميرا ناحية الكود');
  }catch(err){
    await stopCam(false);
    camError(err);
  }finally{
    state.starting = false;
    $('btnCam').disabled = false;
    $('btnCam').textContent = 'تشغيل الكاميرا';
  }
}

async function stopCam(byUser){
  const qr = state.qr;
  state.qr = null;
  if(qr){
    try{ await qr.stop(); }catch(e){}
    try{ qr.clear(); }catch(e){}
  }
  $('reader').innerHTML = '';
  $('readerWrap').classList.remove('on');
  $('btnCam').classList.remove('hide');
  $('btnStop').classList.add('hide');
  $('btnSwap').classList.add('hide');
  if(byUser) $('scanRes').style.display = 'none';
}

async function swapCam(){
  if(!state.cams.length) return;
  state.camIdx = (state.camIdx + 1) % state.cams.length;
  const name = state.cams[state.camIdx].label || ('كاميرا ' + (state.camIdx + 1));
  await stopCam(false);
  toast('ok', 'بتبدّل لـ: ' + name);
  await startCam();
}

function camError(err){
  const m = String((err && (err.message || err.name)) || err || '');
  let why;
  if(/NotAllowed|Permission|denied/i.test(m))
    why = 'الكاميرا مرفوضة من المتصفح.\nافتح إعدادات الموقع → الكاميرا → السماح، وبعدين اعمل Refresh.';
  else if(/NotFound|no camera|Requested device/i.test(m))
    why = 'مفيش كاميرا متاحة على الجهاز ده.';
  else if(/NotReadable|in use|Could not start/i.test(m))
    why = 'الكاميرا مشغولة في تطبيق تاني.\nاقفل أي تطبيق فاتح الكاميرا وجرّب تاني.';
  else if(/Overconstrained|constraint/i.test(m))
    why = 'الكاميرا دي مش مدعومة.\nاضغط "تبديل الكاميرا" وجرّب واحدة تانية.';
  else
    why = 'مقدرتش أفتح الكاميرا.\n' + m;

  say('scanRes', 'bad', why);
  toast('bad', why);
}

async function onScan(text){
  if(state.busy) return;
  state.busy = true;
  try{ state.qr && state.qr.pause(true); }catch(e){}

  await record(String(text).trim(), false, 'scanRes');

  setTimeout(() => {
    try{ state.qr && state.qr.resume(); }catch(e){}
    state.busy = false;
  }, 2500);
}

/* ================= التسجيل ================= */
async function record(code, manual, target){
  if(!code) return;
  say(target, 'wait', 'جاري التسجيل...');

  const payload = { action:'scan', token:state.token, code,
                    eventId: state.activeEvent ? state.activeEvent.id : '' };
  if(manual) payload.manual = true;

  try{
    const r = await call(payload);
    if(r.ok){
      const d = r.data;
      say(target, 'ok', `${d.name}\n${d.state} — ${d.points} نقطة\n${d.event} · ${d.time}`);
      toast('ok', d.name + '\n' + d.state);
      beep(true);
    }else{
      say(target, 'bad', r.error || 'حصل خطأ غير معروف');
      toast('bad', r.error || 'حصل خطأ غير معروف');
      beep(false);
    }
  }catch(e){
    queueAdd({code, eventId: payload.eventId, at: now()});
    say(target, 'wait', 'مفيش نت — اتسجّل على الموبايل وهيترفع أول ما النت يرجع');
    toast('warn', 'مفيش نت — التسجيل محفوظ على الموبايل');
  }
}

function say(id, kind, msg){
  const el = $(id);
  el.className = 'result ' + kind;
  el.style.display = 'block';
  el.textContent = msg;
}

function beep(good){
  try{
    const c = new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = good ? 880 : 220;
    g.gain.value = .08;
    o.start(); o.stop(c.currentTime + (good ? .12 : .3));
  }catch(e){}
}

/* ================= الأوفلاين ================= */
const qGet = () => JSON.parse(localStorage.getItem(K.queue) || '[]');
const qSet = a => { localStorage.setItem(K.queue, JSON.stringify(a)); renderQueue(); };
const queueAdd = it => qSet(qGet().concat([it]));

function renderQueue(){
  const q = qGet();
  $('qBar').style.display = q.length ? 'flex' : 'none';
  $('qTxt').textContent = `${q.length} تسجيل مستني الرفع`;
}

$('btnSync').onclick = syncQueue;
window.addEventListener('online', syncQueue);

async function syncQueue(){
  const q = qGet();
  if(!q.length || !state.token) return;
  $('btnSync').disabled = true; $('btnSync').textContent = 'جاري الرفع...';
  try{
    const r = await call({action:'sync', token:state.token, items:q});
    if(r.ok){
      qSet([]);
      const okN = r.data.results.filter(x => x.ok).length;
      toast('ok', `اترفع ${okN} من ${r.data.results.length} تسجيل`);
    }
  }catch(e){ toast('bad', 'الرفع فشل — النت لسه مقطوع'); }
  $('btnSync').disabled = false; $('btnSync').textContent = 'ارفعها دلوقتي';
}

/* ================= البحث والتسجيل اليدوي ================= */
$('inSearch').addEventListener('input', function(){
  const q = norm(this.value);
  const list = $('searchList');
  hideConfirm();
  $('manRes').style.display = 'none';

  if(!q){ list.innerHTML = ''; return; }

  const hits = state.vols.filter(v =>
    v._n.includes(q) || v._c.includes(q) || v._p.includes(q)).slice(0, 20);

  if(!hits.length){
    list.innerHTML = `<div class="item"><small>مفيش نتائج لـ "${esc(this.value)}"</small></div>`;
    return;
  }

  list.innerHTML = hits.map((v,i) =>
    `<div class="item" data-i="${i}">${esc(v.name)}<br>
     <small>${esc(v.code)} · ${esc(v.rank)} · ${esc(v.status)}</small></div>`).join('');

  list.querySelectorAll('.item[data-i]').forEach(el => {
    el.addEventListener('click', () => pick(hits[+el.dataset.i]));
  });
});

function pick(v){
  if(!state.activeEvent) return toast('warn', 'مفيش فعالية مفتوحة دلوقتي — مينفعش تسجل حضور');
  state.picked = v;
  $('manName').textContent = v.name;
  $('manMeta').textContent = `${v.code} · ${v.rank} · هيتسجل في: ${state.activeEvent.name}`;
  $('manConfirm').style.display = 'block';
}

function hideConfirm(){ $('manConfirm').style.display = 'none'; state.picked = null; }
$('btnManNo').onclick = hideConfirm;

$('btnManOk').onclick = async () => {
  const v = state.picked;
  if(!v) return;
  $('btnManOk').disabled = true;
  await record(v.code, true, 'manRes');
  $('btnManOk').disabled = false;
  hideConfirm();
  $('inSearch').value = '';
  $('searchList').innerHTML = '';
};

function esc(s){ return String(s == null ? '' : s).replace(/[<>&"]/g, c =>
  ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

/* ================= البداية ================= */
window.addEventListener('pagehide', () => { if(state.qr) stopCam(false); });

(async () => {
  renderQueue();
  const t = localStorage.getItem(K.tok);
  if(t){ state.token = t; try{ await boot(); syncQueue(); }catch(e){} }
})();
</script>
